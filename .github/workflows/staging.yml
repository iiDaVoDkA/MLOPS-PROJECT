name: staging
# Validate a release candidate: tests, image build, container smoke test against an
# offline test registry, then publish the image tagged with the commit SHA.
on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  validate-release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    env:
      IMAGE: ghcr.io/iidavodka/mlops-project:${{ github.sha }}
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

      - name: Build offline test registry
        run: |
          python -m scripts.make_test_registry --root /tmp/ci-registry --force
          chmod -R a+rwX /tmp/ci-registry
      - name: Build image
        run: |
          docker build --build-arg GIT_SHA="$GIT_SHA" \
            --label org.opencontainers.image.source=https://github.com/iiDaVoDkA/MLOPS-PROJECT \
            -t "$IMAGE" .
      - name: Start container
        run: |
          docker run -d --name app -p 8000:8000 \
            -v /tmp/ci-registry:/tmp/ci-registry \
            -e MLFLOW_TRACKING_URI=sqlite:////tmp/ci-registry/mlflow.db \
            -e MODEL_NAME=sms-spam-classifier -e MODEL_ALIAS=champion \
            "$IMAGE"
      - name: Container smoke test
        id: smoke
        run: |
          python -m scripts.smoke_test --url http://localhost:8000 --expect-version 1 \
            --expect-app-sha "$GIT_SHA" --timeout 120 | tee smoke-container.json

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        id: push
        run: docker push "$IMAGE"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Staging release candidate"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`$GIT_SHA\` |"
            echo "| Image | \`$IMAGE\` |"
            echo "| Container smoke test | ${{ steps.smoke.outcome || 'not run' }} |"
            echo "| Image pushed | ${{ steps.push.outcome || 'not run' }} |"
            echo "| Job status | ${{ job.status }} |"
            if [ -s smoke-container.json ]; then
              echo ""
              echo "<details><summary>Smoke test output</summary>"
              echo ""
              echo '```json'
              cat smoke-container.json
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Container logs
        if: always()
        run: docker logs app || true
