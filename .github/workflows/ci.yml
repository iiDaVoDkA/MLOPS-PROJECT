name: ci
on:
  pull_request:
    branches: [dev, staging, main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Build offline test registry
        run: |
          python -m scripts.make_test_registry --root /tmp/ci-registry --force
          chmod -R a+rwX /tmp/ci-registry
      - name: Build image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t sms-spam:ci .
      - name: Start container
        run: |
          docker run -d --name app -p 8000:8000 \
            -v /tmp/ci-registry:/tmp/ci-registry \
            -e MLFLOW_TRACKING_URI=sqlite:////tmp/ci-registry/mlflow.db \
            -e MODEL_NAME=sms-spam-classifier -e MODEL_ALIAS=champion \
            sms-spam:ci
      - name: Smoke test
        run: |
          python -m scripts.smoke_test --url http://localhost:8000 --expect-version 1 \
            --expect-app-sha ${{ github.sha }} --timeout 120
      - name: Container runs as non-root
        run: |
          uid=$(docker exec app id -u)
          echo "container uid: $uid"
          test "$uid" != "0"
      - name: Container logs and image size
        if: always()
        run: |
          docker logs app || true
          docker image ls sms-spam:ci
